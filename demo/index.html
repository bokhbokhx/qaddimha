<style>

:root {
  --bg: #faf7f0; --surface: #ffffff; --ink: #1c2b25; --muted: #5d6b64; --line: #e4ddcd;
  --brand: #0f3d2e; --brand-2: #1f6b4a; --brand-soft: #e7f1ea; --gold: #b8903a; --gold-soft: #f7eed8;
  --ok: #17603a; --ok-soft: #e3f2e8; --warn: #7a5b12; --warn-soft: #fbf1d8; --bad: #9a2f1f; --bad-soft: #fbe8e4;
  --on-brand: #ffffff;
  --display: "Noto Kufi Arabic", "IBM Plex Sans Arabic", Tahoma, sans-serif;
  --body: "IBM Plex Sans Arabic", Tahoma, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1714; --surface: #16211c; --ink: #e8efe9; --muted: #9fb0a7; --line: #2a3a33;
  --brand: #5fbf8f; --brand-2: #7fd1a7; --brand-soft: #1b3027; --gold: #d9b45e; --gold-soft: #2c2716;
  --ok: #7fd1a7; --ok-soft: #173326; --warn: #e6c46e; --warn-soft: #2e2814; --bad: #f19a88; --bad-soft: #3a1d18;
  --on-brand: #0f1714; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1714; --surface: #16211c; --ink: #e8efe9; --muted: #9fb0a7; --line: #2a3a33;
  --brand: #5fbf8f; --brand-2: #7fd1a7; --brand-soft: #1b3027; --gold: #d9b45e; --gold-soft: #2c2716;
  --ok: #7fd1a7; --ok-soft: #173326; --warn: #e6c46e; --warn-soft: #2e2814; --bad: #f19a88; --bad-soft: #3a1d18;
  --on-brand: #0f1714; color-scheme: dark; }

* { box-sizing: border-box; }
html { direction: rtl; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.75; }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--display); color: var(--brand); text-wrap: balance; margin: 0; line-height: 1.5; }
h1 { font-size: 1.6rem; } h2 { font-size: 1.2rem; } h3 { font-size: 1rem; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.tab { font-variant-numeric: tabular-nums; }
.ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }

/* الشريط العلوي */
.top { background: var(--brand); color: var(--on-brand); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding-block: 12px; }
.logo { font-family: var(--display); font-weight: 800; font-size: 1.5rem; }
.demo-pill { background: var(--gold-soft); color: var(--warn); border-radius: 999px; padding: 2px 12px; font-size: .8rem; font-weight: 500; }
.app-title { font-size: .9rem; opacity: .85; }

/* المراحل */
.steps { border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--brand); }
.steps-scroll { overflow-x: auto; }
.steps ol { list-style: none; margin: 0; padding-block: 10px; display: flex; gap: 6px; min-width: max-content; }
.steps a { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--muted); padding: 6px 12px; border-radius: 10px; font-size: .9rem; white-space: nowrap; }
.steps a:hover { background: var(--brand-soft); color: var(--ink); }
.steps a[aria-current="page"] { background: var(--brand); color: var(--on-brand); }
.dot { width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; font-size: .75rem; border: 1.5px solid currentColor; }
.steps a.done .dot { background: var(--ok); border-color: var(--ok); color: var(--surface); }

/* الهيكل */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; padding-block: 24px 48px; }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } }
main { min-width: 0; display: grid; gap: 16px; align-content: start; }
aside { display: grid; gap: 16px; align-content: start; }
.head { display: grid; gap: 4px; }
.head p { color: var(--muted); max-width: 62ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: grid; gap: 12px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.between { justify-content: space-between; }
.muted { color: var(--muted); font-size: .85rem; }
.src { color: var(--muted); font-size: .8rem; }
.src q { border-inline-start: 2px solid var(--gold); padding-inline-start: 8px; display: block; margin-top: 2px; quotes: "«" "»"; }

.btn { border: 0; border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 500; background: var(--brand); color: var(--on-brand); }
.btn:hover { filter: brightness(1.08); }
.btn.sec { background: transparent; color: var(--brand); border: 1px solid var(--brand); }
.btn.gold { background: var(--gold); color: #1c2b25; }
.btn.small { padding: 4px 10px; font-size: .85rem; }
.btn[disabled] { opacity: .45; cursor: not-allowed; filter: none; }
.chip { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 10px; font-size: .78rem; font-weight: 500; white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.neutral { background: var(--brand-soft); color: var(--brand); }
.chip.gold { background: var(--gold-soft); color: var(--warn); }

.list { display: grid; }
.item { display: grid; gap: 6px; padding-block: 12px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; padding-top: 0; }
.field { display: grid; gap: 4px; }
.field label { font-size: .85rem; font-weight: 500; }
input[type=text], input[type=number], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 100%; }
textarea { resize: vertical; line-height: 1.9; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .grid3, .grid2 { grid-template-columns: minmax(0, 1fr); } }

.notice { border-radius: 12px; padding: 10px 14px; font-size: .9rem; }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.notice.ok { background: var(--ok-soft); color: var(--ok); }
.notice.bad { background: var(--bad-soft); color: var(--bad); }
.notice.gold { background: var(--gold-soft); color: var(--warn); }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 700px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.kpi b { display: block; font-size: 1.15rem; color: var(--ink); }
.kpi span { color: var(--muted); font-size: .8rem; }

.tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; min-width: 760px; font-size: .88rem; }
th { background: var(--brand); color: var(--on-brand); text-align: right; font-weight: 500; padding: 8px; }
td { padding: 6px 8px; border-top: 1px solid var(--line); vertical-align: top; }
td input, td select { padding: 4px 6px; }
td.num, th.num { text-align: left; direction: ltr; font-variant-numeric: tabular-nums; }
tr.excluded td { background: var(--bad-soft); }

.meter { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--brand-2); transition: width .4s; }
.side h3 { font-size: .95rem; }
.side ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: .88rem; }
.side li a { color: var(--bad); text-decoration: none; }
.side li a:hover { text-decoration: underline; }

.chat { display: grid; gap: 8px; }
.bubble { border-radius: 14px; padding: 8px 12px; max-width: 92%; font-size: .9rem; }
.bubble.ai { background: var(--brand-soft); justify-self: start; }
.bubble.me { background: var(--gold-soft); justify-self: end; }
.option { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 6px; }
.option.picked { border-color: var(--brand-2); background: var(--brand-soft); }

.diff del { background: var(--bad-soft); color: var(--bad); }
.diff ins { background: var(--ok-soft); color: var(--ok); text-decoration: none; }

.doc { background: #fff; color: #1c2b25; border-radius: 6px; padding: 28px 26px; box-shadow: 0 2px 14px rgba(0,0,0,.12); max-width: 560px; justify-self: center; width: 100%; position: relative; overflow: hidden; }
.doc h4 { font-family: var(--display); color: #0f3d2e; margin: 14px 0 4px; font-size: 1rem; border-bottom: 1.5px solid #b8903a; padding-bottom: 2px; }
.doc .stamp { position: absolute; inset: 40% 0 auto; text-align: center; font-family: var(--display); font-size: 4rem; color: rgba(184,144,58,.16); transform: rotate(-25deg); pointer-events: none; }
.doc .mini-logo { width: 48px; height: 48px; border-radius: 8px; background: #0f3d2e; color: #d6b25e; display: grid; place-items: center; font-family: var(--display); font-weight: 800; }
.doc small { color: #5d6b64; }
.files { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.file { border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-size: .85rem; display: grid; gap: 2px; }
.file b { font-family: var(--display); color: var(--brand); }
footer { color: var(--muted); font-size: .8rem; padding-block: 0 32px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

function budget() {
  const b = { total: 0, donor: 0, self: 0, partner: 0, inKind: 0 };
  for (const l of S.lines) {
    const t = lineTotal(l);
    b.total += t;
    if (l.src === "DONOR") b.donor += t; else if (l.src === "SELF") b.self += t; else b.partner += t;
    if (l.kind === "IN_KIND" && l.src !== "DONOR") b.inKind += t;
  }
  b.share = b.total ? ((b.total - b.donor) / b.total) * 100 : 0;
  return b;
}

const RES = { MET: ["مستوفى", "ok"], NV: ["يحتاج تحققًا", "warn"], NOT: ["غير مستوفى", "bad"] };

function readiness() {
  const items = [];
  const add = (ok, label, msg, go, counted = true) => items.push({ ok, label, msg, go, counted });
  add(!S.facts.some((f) => f.status === "EXTRACTED"), "ملف الجمعية", "معلومات مستخرجة لم تُؤكد", "org", false);
  add(S.grantConfirmed, "بيانات المنحة", "أكّد البيانات المستخرجة", "grant");
  add(!!S.deadline.resolved, "تعارض الموعد النهائي", "مصدران يذكران موعدين مختلفين", "grant");
  for (const r of requirements()) add(r.res === "MET", `${r.text}`, `${RES[r.res][0]}: ${r.ev}`, r.go);
  add(S.idea.approved, "ملخص الفكرة", "اعتمد الملخص", "idea");
  for (const s of S.sections) add(s.status === "APPROVED" && !/\[يحتاج استكمال/.test(s.text), s.label, s.status === "REVIEW" ? "يحتاج مراجعة بعد تعديل مؤثر" : /\[يحتاج استكمال/.test(s.text) ? "موضع «يحتاج استكمال»" : "لم يُعتمد", "project");
  add(!S.lines.some((l) => l.est), "بنود الميزانية التقديرية", `${S.lines.filter((l) => l.est).length} بنود تحتاج اعتمادًا`, "budget");
  for (const a of S.answers) {
    const n = a.type === "words" ? words(a.text) : chars(a.text);
    add(a.approved && !a.stale && n <= a.limit, a.q, a.stale ? "قديمة بعد تعديل المشروع" : n > a.limit ? "تتجاوز الحد" : "لم تُعتمد", "answers");
  }
  add(S.proposals.length === 0, "مقترحات التعديل", `${S.proposals.length} مقترحات بانتظار قرارك`, "budget");
  const counted = items.filter((i) => i.counted);
  const ok = counted.filter((i) => i.ok).length;
  return { items, blockers: items.filter((i) => !i.ok), pct: Math.floor((ok / counted.length) * 100), ok, total: counted.length };
}

// ===== التنقل =====
function route() {
  const h = (location.hash || "#start").slice(1);
  return STEPS.some((s) => s[0] === h) ? h : "start";
}
function go(name) { location.hash = name; }
window.addEventListener("hashchange", render);

function stepDone(name) {
  const r = readiness();
  return {
    org: !S.facts.some((f) => f.status === "EXTRACTED"),
    grant: S.grantConfirmed && !!S.deadline.resolved,
    eligibility: requirements().filter((x) => x.cat !== "اشتراطات مالية").every((x) => x.res === "MET"),
    idea: S.idea.approved,
    project: S.sections.every((s) => s.status === "APPROVED"),
    budget: !S.lines.some((l) => l.est) && !S.lines.some(isExcluded),
    answers: S.answers.every((a) => a.approved && !a.stale),
    readiness: !!S.approvedVersion,
    export: S.paid && !!S.approvedVersion && r.blockers.length === 0,
  }[name];
}

function render() {
  const cur = route();
  $("#steps").innerHTML = STEPS.map(([k, l], i) => `<li><a href="#${k}" class="${stepDone(k) ? "done" : ""}" ${k === cur ? 'aria-current="page"' : ""}><span class="dot tab">${stepDone(k) ? "✓" : i}</span>${l}</a></li>`).join("");
  const cur_a = document.querySelector('.steps a[aria-current="page"]');
  if (cur_a) cur_a.scrollIntoView({ block: "nearest", inline: "center" });
  $("#view").innerHTML = VIEWS[cur]();
  renderSide();
  bind(cur);
}

// ===== تحليل أثر التعديل =====
function replaceNum(text, from, to) {
  return text.replace(new RegExp(`(?<![\\d,.])${from}(?![\\d,.])`, "g"), String(to));
}
function saveParams() {
  const nb = Math.max(1, parseInt($("#p-b").value, 10) || S.app.beneficiaries);
  const nd = Math.max(1, parseInt($("#p-d").value, 10) || S.app.duration);
  const nr = $("#p-r").value;
  const out = [];
  if (nb !== S.app.beneficiaries) {
    const from = S.app.beneficiaries;
    let recalc = 0;
    S.lines.forEach((l) => { if (l.followB) { l.qty = nb; recalc++; } });
    S.sections.forEach((s) => {
      const after = replaceNum(s.text, from, nb);
      if (after !== s.text) { S.proposals.push({ kind: "sec", key: s.key, label: s.label, before: s.text, after }); if (s.status === "APPROVED") s.status = "REVIEW"; }
    });
    S.answers.forEach((a, i) => {
      const after = replaceNum(a.text, from, nb);
      if (after !== a.text) { S.proposals.push({ kind: "ans", key: i, label: a.q, before: a.text, after }); a.stale = true; a.approved = false; }
    });
    out.push(`عدد المستفيدين ${from} ← ${nb}: أُعيد حساب ${recalc} بند فورًا، وأُنشئت ${S.proposals.length} مقترحات تعديل نصية تنتظر موافقتك.`);
    S.app.beneficiaries = nb;
  }
  if (nd !== S.app.duration) {
    let recalc = 0;
    S.lines.forEach((l) => { if (l.followD && l.calc === "rec") { l.periods = nd; recalc++; } });
    out.push(`المدة ${S.app.duration} ← ${nd} شهرًا: أُعيد حساب ${recalc} بند دوري.`);
    S.app.duration = nd;
  }
  if (nr !== S.app.region) { S.app.region = nr; out.push(`منطقة التنفيذ: ${nr || "—"}`); }
  if (out.length) S.approvedVersion = S.approvedVersion ? { ...S.approvedVersion, outdated: true } : null;
  render();
  if (out.length) $("#impact").innerHTML = `<div class="notice warn">${out.map(esc).join("<br>")}<br>حُفظت نسخة قبل التغيير.${S.proposals.length ? ' <a href="#budget">راجع المقترحات</a>' : ""}</div>`;
}

         ["حاضنة مشاريع رقمية صغيرة", "تتصل بمحور سوق العمل لكنها أبعد عن خبرة الجمعية.", "⚠ خارج الاختصاص الحالي — تحتاج شريكًا متخصصًا"]]
        .map(([t, r, a], i) => `<div class="option ${S.idea.picked === i ? "picked" : ""}"><b>${t}</b><p class="muted">${r}</p><p class="muted">الافتراضات: ${a}</p><div><button class="btn small sec" data-pick="${i}">استخدم هذا المسار</button></div></div>`).join("")}
    </section>` : ""}
    ${S.idea.picked !== null ? `<section class="panel"><h2>ملخص الفكرة</h2>
      <textarea id="i-sum" rows="4" aria-label="ملخص الفكرة">${esc(S.idea.summary)}</textarea>
      <div class="row"><button class="btn" id="i-approve">${S.idea.approved ? "معتمد ✓" : "اعتماد الملخص"}</button><span class="muted">الأعداد والمدة تقديرية حتى تعتمدها.</span></div></section>` : ""}
    ${S.idea.approved ? '<div class="row"><button class="btn" data-go="project">التالي: محرر المشروع</button></div>' : ""}`,

  project: () => `
    <div class="head"><h1>محرر المشروع</h1><p>مسودة أعدها المساعد من الفكرة المعتمدة. عدّل ثم اعتمد كل قسم. الأقسام التي تحتوي «يحتاج استكمال» لا تُعتمد.</p></div>
    ${!S.idea.approved ? '<div class="notice warn">اعتمد ملخص الفكرة أولًا. <a href="#idea">اذهب إلى الفكرة</a></div>' : ""}
    ${S.sections.map((s, i) => `<section class="panel">
      <div class="row between"><h2>${s.label}</h2><div class="row">${s.status === "APPROVED" ? '<span class="chip ok">معتمد</span>' : s.status === "REVIEW" ? '<span class="chip bad">يحتاج مراجعة</span>' : '<span class="chip warn">مسودة</span>'}${s.est && s.status !== "APPROVED" ? '<span class="chip gold">تقديري يحتاج اعتمادًا</span>' : ""}</div></div>
      <textarea rows="4" data-sec="${i}" aria-label="${s.label}">${esc(s.text)}</textarea>
      ${s.status !== "APPROVED" ? `<div class="row"><button class="btn small" data-approve-sec="${i}" ${/\[يحتاج استكمال/.test(s.text) || !S.idea.approved ? "disabled" : ""}>اعتماد القسم</button>${/\[يحتاج استكمال/.test(s.text) ? '<span class="muted">استبدل موضع «يحتاج استكمال» بدليل الحاجة ومصدره.</span>' : ""}</div>` : ""}
    </section>`).join("")}
    <div class="row"><button class="btn" data-go="budget">التالي: الميزانية</button></div>`,

  budget: () => {
    const b = budget();
    return `
    <div class="head"><h1>راجع الميزانية</h1><p>عدّل الكمية أو التكلفة أو المصدر وستُعاد الحسابات فورًا. الإجمالي = الكمية × تكلفة الوحدة، وللبنود الدورية × عدد الفترات.</p></div>
    ${S.proposals.length ? `<section class="panel"><h2>مقترحات تعديل بانتظار موافقتك (${S.proposals.length})</h2>
      ${S.proposals.map((p, i) => `<div class="option"><b>${p.kind === "sec" ? "قسم" : "إجابة"}: ${esc(p.label)}</b><div class="diff">${diffWords(p.before, p.after)}</div><div class="row"><button class="btn small" data-apply="${i}">تطبيق</button><button class="btn small sec" data-reject="${i}">رفض</button></div></div>`).join("")}</section>` : ""}
    <div class="kpis">
      <div class="kpi"><span>إجمالي المشروع</span><b class="tab">${sar(b.total)}</b></div>
      <div class="kpi"><span>المطلوب من المانح</span><b class="tab">${sar(b.donor)}</b></div>
      <div class="kpi"><span>المساهمة الذاتية</span><b class="tab">${sar(b.self)}</b></div>
      <div class="kpi"><span>مساهمة الشركاء (عيني)</span><b class="tab">${sar(b.partner)}</b></div>
    </div>
    <section class="panel">
      <div class="row">
        ${requirements().filter((r) => r.cat === "اشتراطات مالية").map((r) => `<span class="chip ${RES[r.res][1]}">${RES[r.res][0]}: ${r.text}</span>`).join("")}
      </div>
      <div class="tablebox"><table>
        <thead><tr><th>البند</th><th>الكمية</th><th>تكلفة الوحدة (ر.س)</th><th>الفترات</th><th class="num">الإجمالي</th><th>المصدر</th><th>الحالة</th></tr></thead>
        <tbody>${S.lines.map((l, i) => `<tr class="${isExcluded(l) ? "excluded" : ""}">
          <td><b>${esc(l.item)}</b><div class="muted">${l.cc}${l.followB ? " · يتبع عدد المستفيدين" : ""}${l.followD ? " · يتبع المدة" : ""}</div>${isExcluded(l) ? '<div style="color:var(--bad);font-size:.8rem">بند مستبعد في شروط المنحة إذا موّله المانح</div>' : ""}</td>
          <td><input type="number" min="0" value="${l.qty}" data-qty="${i}" aria-label="الكمية" class="tab" style="width:80px" ${l.followB ? "disabled" : ""}></td>
          <td><input type="number" min="0" step="0.01" value="${(l.unit / 100).toFixed(2)}" data-unit="${i}" aria-label="تكلفة الوحدة" class="tab" style="width:110px"></td>
          <td class="tab">${l.calc === "rec" ? l.periods : "—"}</td>
          <td class="num"><b>${sar(lineTotal(l))}</b></td>
          <td><select data-src="${i}" aria-label="المصدر">${[["DONOR", "المانح"], ["SELF", "الجمعية"], ["PARTNER", "شريك (عيني)"]].map(([v, t]) => `<option value="${v}" ${l.src === v ? "selected" : ""}>${t}</option>`).join("")}</select></td>
          <td>${l.est ? '<span class="chip gold">تقديري</span>' : '<span class="chip ok">معتمد</span>'}</td>
        </tr>`).join("")}</tbody>
      </table></div>
      <div class="row between"><span class="muted tab">المساهمة غير المانحة ${b.share.toFixed(2)}% — العيني يُحتسب في الإجمالي ولا يُخصم من النقدي. لا ضريبة أو مصاريف إدارية تُضاف تلقائيًا.</span>
      ${S.lines.some((l) => l.est) ? '<button class="btn small" id="b-approve">اعتماد كل البنود بعد مراجعتها</button>' : ""}</div>
    </section>
    <div class="row"><button class="btn" data-go="answers">التالي: إجابات الجهة</button></div>`;
  },

  answers: () => `
    <div class="head"><h1>إجابات نموذج الجهة</h1><p>الحدود تُفحص أثناء الكتابة. طريقة العد معلنة وقد تختلف عن بوابة الجهة.</p></div>
    ${S.answers.map((a, i) => {
      const n = a.type === "words" ? words(a.text) : chars(a.text);
      return `<section class="panel">
        <div class="row between"><h2>${i + 1}. ${a.q}</h2><div class="row">${a.stale ? '<span class="chip bad">قديمة بعد تعديل المشروع</span>' : a.approved ? '<span class="chip ok">معتمدة</span>' : '<span class="chip warn">مسودة</span>'}</div></div>
        <textarea rows="4" data-ans="${i}" aria-label="${a.q}">${esc(a.text)}</textarea>
        <div class="row between"><span class="tab" id="cnt-${i}" style="color:${n > a.limit ? "var(--bad)" : "var(--muted)"}">${n} / ${a.limit} ${a.type === "words" ? "كلمة" : "حرف"}${n > a.limit ? " — يتجاوز الحد" : ""}</span>
        ${!a.approved || a.stale ? `<button class="btn small" data-approve-ans="${i}" ${n > a.limit ? "disabled" : ""}>اعتماد الإجابة</button>` : ""}</div>
      </section>`;
    }).join("")}
    <div class="row"><button class="btn" data-go="readiness">التالي: الجاهزية</button></div>`,

  readiness: () => {
    const r = readiness();
    return `
    <div class="head"><h1>تحقق من جاهزية الطلب</h1><p>نسبة الاكتمال تقيس المتطلبات المعروفة فقط، وتبقى العوائق ظاهرة حتى لو ارتفعت النسبة.</p></div>
    <section class="panel">
      <div class="row between"><h2 style="color:${r.blockers.length ? "var(--warn)" : "var(--ok)"}">${r.blockers.length ? "مسودة — توجد عوائق" : "جاهز للتقديم"}</h2><span class="tab">${r.pct}%</span></div>
      <div class="meter"><i style="width:${r.pct}%"></i></div>
      <p class="muted tab">نسبة الاكتمال = ${r.ok} متطلبًا مستوفى ÷ ${r.total} متطلبًا معروفًا. ليست نسبة قبول ولا تقديرًا لفرص الفوز.</p>
    </section>
    ${r.blockers.length ? `<section class="panel"><h2>العوائق (${r.blockers.length})</h2><div class="list">
      ${r.blockers.map((b) => `<div class="item"><div class="row between"><b>${esc(b.label)}</b><a href="#${b.go}">معالجة</a></div><div class="muted">${esc(b.msg)}</div></div>`).join("")}</div></section>` : ""}
    <section class="panel">
      <h2>اعتماد نسخة</h2>
      <p class="muted">الاعتماد يحفظ لقطة ثابتة من الطلب. كل ملفات التصدير تُنشأ منها، والتعديلات اللاحقة لا تغيّرها.</p>
      ${S.approvedVersion ? `<div class="notice ${S.approvedVersion.ready ? "ok" : "warn"}">اعتُمدت النسخة رقم ${S.approvedVersion.n} ${S.approvedVersion.ready ? "وهي جاهزة للتقديم" : "(مسودة — توجد عوائق)"}.${S.approvedVersion.outdated ? " تغيّر الطلب بعدها؛ اعتمد نسخة جديدة لتضمين التعديلات." : ""}</div>` : ""}
      <div class="row"><button class="btn" id="r-approve">اعتماد نسخة من الحالة الحالية</button><button class="btn sec" data-go="export">إلى التصدير</button></div>
    </section>`;
  },

  export: () => {
    const r = readiness();
    const v = S.approvedVersion;
    const draft = !v || !v.ready || !S.paid;
    const b = budget();
    return `
    <div class="head"><h1>صدّر حزمة التقديم</h1><p>كل الصيغ تُنشأ من نسخة معتمدة واحدة، وتحمل رقمها وتاريخ التصدير، وتُوسم «مسودة» إذا لم تكتمل الجاهزية أو قبل شراء الحزمة.</p></div>
    ${!v ? '<div class="notice warn">لا توجد نسخة معتمدة بعد. <a href="#readiness">اعتمد نسخة</a></div>' : ""}
    <section class="panel">
      <div class="row between"><h2>الشراء (محاكاة)</h2>${S.paid ? '<span class="chip ok">مدفوع — محاكاة</span>' : '<span class="chip warn">غير مدفوع</span>'}</div>
      <p class="muted">حزمة طلب دعم: 1,490 ر.س (سعر تجريبي) — مشروع واحد لدى جهة واحدة، التصدير النهائي بلا وسم مسودة. لا عمولة على قيمة المنحة.</p>
      ${S.paid ? "" : '<div class="row"><button class="btn gold" id="x-pay">محاكاة دفع ناجح — لا يتم تحصيل مبلغ</button></div>'}
    </section>
    <section class="panel">
      <h2>معاينة وثيقة المشروع ${v ? `— النسخة ${v.n}` : ""}</h2>
      <div class="doc">
        ${draft ? '<div class="stamp">مسودة</div>' : ""}
        <div class="mini-logo">أثر</div>
        <small>جمعية أثر للتنمية المجتمعية</small>
        <div style="font-family:var(--display);font-size:1.3rem;color:#0f3d2e;font-weight:800">مشروع «جاهز رقميًا»</div>
        <small>مقدم إلى: صندوق الأثر التجريبي للتنمية — منحة تمكين المجتمع</small><br>
        <small>${v ? `النسخة رقم ${v.n} — ` : ""}بيانات تجريبية غير حقيقية${draft ? (r.blockers.length ? ` — مسودة: ${r.blockers.length} عوائق` : " — مسودة: قبل الشراء") : ""}</small>
        <h4>${S.sections[0].label}</h4><p style="font-size:.9rem">${esc(S.sections[0].text)}</p>
        <h4>ملخص الميزانية</h4>
        <p style="font-size:.9rem" class="tab">الإجمالي ${sar(b.total)} · المطلوب من المانح ${sar(b.donor)} · المساهمة الذاتية ${sar(b.self)}</p>
      </div>
    </section>
    <section class="panel"><h2>الملفات التي يُنشئها التطبيق</h2>
      <div class="files">
        ${[["PDF", "وثيقة المشروع"], ["DOCX", "وثيقة المشروع لـ Word"], ["XLSX", "الميزانية بصيغ حقيقية"], ["TXT", "إجابات النموذج"], ["PDF", "قائمة المتطلبات والمرفقات"], ["PDF", "ملخص تنفيذي صفحة واحدة"], ["ZIP", "الحزمة كاملة"]]
          .map(([f, d]) => `<div class="file"><b class="ltr">${f}</b><span>${d}</span><span class="chip ${draft ? "warn" : "ok"}" style="justify-self:start">${draft ? "مسودة" : "نهائي"}</span></div>`).join("")}
      </div>
      <p class="muted">في هذا العرض نعرض المعاينة فقط؛ تنزيل الملفات الفعلية متاح في التطبيق الكامل.</p>
    </section>`;
  },
};

function diffWords(a, b) {
  const A = a.split(/(\s+)/), B = b.split(/(\s+)/);
  let out = "";
  const n = Math.max(A.length, B.length);
  for (let i = 0; i < n; i++) {
    if (A[i] === B[i]) out += esc(A[i] ?? "");
    else out += (A[i] ? `<del>${esc(A[i])}</del>` : "") + (B[i] ? `<ins>${esc(B[i])}</ins>` : "");
  }
  return `<p style="white-space:pre-wrap">${out}</p>`;
}

// ===== الأحداث =====
function bind(cur) {
  document.querySelectorAll("[data-go]").forEach((b) => (b.onclick = () => go(b.dataset.go)));
  document.querySelectorAll("[data-confirm]").forEach((b) => (b.onclick = () => { S.facts[+b.dataset.confirm].status = "CONFIRMED"; render(); }));
  const gc = $("#g-confirm"); if (gc) gc.onclick = () => { S.grantConfirmed = true; render(); };
  document.querySelectorAll("[data-deadline]").forEach((b) => (b.onclick = () => { S.deadline.resolved = S.deadline.options[+b.dataset.deadline][0]; render(); }));
  document.querySelectorAll("[data-manual]").forEach((b) => (b.onclick = () => {
    const id = b.dataset.manual; const ev = $("#ev-" + id).value.trim();
    if (!ev) { $("#ev-" + id).focus(); $("#ev-" + id).placeholder = "أضف الدليل أولًا — الاستيفاء دون دليل لا يُقبل"; return; }
    S.manual[id === "r3" ? "exp" : "fit"] = ev; render();
  }));
  document.querySelectorAll("[data-doc]").forEach((b) => (b.onclick = () => { S.docs[b.dataset.doc === "m2" ? "financials" : "pledge"] = true; render(); }));
  const ia = $("#i-ask"); if (ia) ia.onclick = () => { S.idea.asked = true; render(); };
  document.querySelectorAll("[data-pick]").forEach((b) => (b.onclick = () => {
    const i = +b.dataset.pick; S.idea.picked = i; S.idea.approved = false;
    S.idea.summary = i === 0 ? "مشروع «جاهز رقميًا» يمكّن 150 شابًا وشابة في منطقة الرياض خلال 12 شهرًا من المهارات الرقمية والتهيئة لسوق العمل، بناءً على خبرة الجمعية في «مهارتي». الأعداد تقديرية." : i === 1 ? "مسار مهارات رقمية داخل برنامج «سواعد» التطوعي." : "حاضنة مشاريع رقمية صغيرة للشباب (تحتاج شريكًا متخصصًا).";
    render();
  }));
  const isum = $("#i-sum"); if (isum) isum.oninput = () => { S.idea.summary = isum.value; S.idea.approved = false; };
  const iap = $("#i-approve"); if (iap) iap.onclick = () => { if (S.idea.summary.trim().length > 20) { S.idea.approved = true; render(); } };
  document.querySelectorAll("[data-sec]").forEach((t) => (t.oninput = () => {
    const s = S.sections[+t.dataset.sec]; s.text = t.value; if (s.status === "APPROVED") s.status = "DRAFT";
    S.answers.forEach((a) => { if (a.approved) { a.stale = true; a.approved = false; } });
    const btn = document.querySelector(`[data-approve-sec="${t.dataset.sec}"]`); if (btn) btn.disabled = /\[يحتاج استكمال/.test(s.text) || !S.idea.approved;
    renderSide();
  }));
  document.querySelectorAll("[data-approve-sec]").forEach((b) => (b.onclick = () => { const s = S.sections[+b.dataset.approveSec]; s.status = "APPROVED"; s.est = false; render(); }));
  document.querySelectorAll("[data-qty]").forEach((x) => (x.onchange = () => { const l = S.lines[+x.dataset.qty]; l.qty = Math.max(0, Math.round(+x.value || 0)); l.est = true; render(); }));
  document.querySelectorAll("[data-unit]").forEach((x) => (x.onchange = () => { const l = S.lines[+x.dataset.unit]; l.unit = Math.max(0, Math.round((+x.value || 0) * 100)); l.est = true; render(); }));
  document.querySelectorAll("[data-src]").forEach((x) => (x.onchange = () => { const l = S.lines[+x.dataset.src]; l.src = x.value; l.kind = x.value === "PARTNER" ? "IN_KIND" : "CASH"; render(); }));
  const ba = $("#b-approve"); if (ba) ba.onclick = () => { S.lines.forEach((l) => (l.est = false)); render(); };
  document.querySelectorAll("[data-apply]").forEach((b) => (b.onclick = () => {
    const p = S.proposals.splice(+b.dataset.apply, 1)[0];
    if (p.kind === "sec") { const s = S.sections.find((x) => x.key === p.key); s.text = p.after; s.status = "DRAFT"; }
    else { const a = S.answers[p.key]; a.text = p.after; a.stale = false; a.approved = false; }
    render();
  }));
  document.querySelectorAll("[data-reject]").forEach((b) => (b.onclick = () => { S.proposals.splice(+b.dataset.reject, 1); render(); }));
  document.querySelectorAll("[data-ans]").forEach((t) => (t.oninput = () => {
    const i = +t.dataset.ans, a = S.answers[i]; a.text = t.value; a.approved = false;
    const n = a.type === "words" ? words(a.text) : chars(a.text);
    const c = $("#cnt-" + i); c.textContent = `${n} / ${a.limit} ${a.type === "words" ? "كلمة" : "حرف"}${n > a.limit ? " — يتجاوز الحد" : ""}`; c.style.color = n > a.limit ? "var(--bad)" : "var(--muted)";
    const btn = document.querySelector(`[data-approve-ans="${i}"]`); if (btn) btn.disabled = n > a.limit;
  }));
  document.querySelectorAll("[data-approve-ans]").forEach((b) => (b.onclick = () => { const a = S.answers[+b.dataset.approveAns]; a.approved = true; a.stale = false; render(); }));
  const ra = $("#r-approve"); if (ra) ra.onclick = () => { S.approvedVersion = { n: (S.approvedVersion?.n ?? 0) + 1, ready: readiness().blockers.length === 0, outdated: false }; render(); };
  const xp = $("#x-pay"); if (xp) xp.onclick = () => { S.paid = true; render(); };
}

render();
</script>
</body>
</html>
