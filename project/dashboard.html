        <div class="bars">${phases.map((p) => { const ts = TASKS.filter((t) => t.phase === p); return `<button class="bar" data-phase="${esc(p)}" aria-pressed="${ui.phase === p}"><span>${p}</span><span class="track" style="width:${(ts.length / max) * 100}%">${ts.map((t) => `<i style="flex:1;background:${STATUS[t.status][2]}"></i>`).join("")}</span><b class="tab">${ts.length}</b></button>`; }).join("")}</div></section>
      <section class="card enter"><h2>مهام كل شخص</h2><p class="muted">كل نقطة مهمة بلون حالتها.</p>
        <div class="people">${people.map((p) => { const ts = TASKS.filter((t) => t.who.split(" + ").includes(p)); return `<div class="person"><span>${p}</span><span class="dots">${ts.map((t) => `<i title="${esc(t.task)}" style="background:${STATUS[t.status][2]}"></i>`).join("")}</span><b class="tab">${ts.length}</b></div>`; }).join("")}</div>
        <div class="tools">${Object.values(STATUS).map(([l, c]) => `<span class="pill ${c}">${l}</span>`).join("")}</div></section>
    </div>
    <section class="card enter"><h2>جدول المهام</h2>
      ${ui.phase ? `<div class="filter-note">مصفّى: ${esc(ui.phase)} <button id="clear-phase">عرض الكل</button></div>` : ""}
      <div class="tablebox"><table><thead><tr><th>#</th><th>المهمة</th><th>المرحلة</th><th>على مين</th><th>الحالة</th></tr></thead>
      <tbody>${rows.map((t) => `<tr><td class="id tab">${t.id}</td><td>${esc(t.task)}</td><td>${t.phase}</td><td>${t.who}</td><td><span class="pill ${STATUS[t.status][1]}">${STATUS[t.status][0]}</span></td></tr>`).join("")}</tbody></table></div></section>
  </div>`;
}
function viewDecisions() {
  const all = [...OPEN, ...DECISIONS];
  const areas = [...new Set(all.map((d) => d.area))];
  const q = ui.q.trim();
  const rows = all.filter((d) => (!ui.openOnly || d.open) && (!ui.area || d.area === ui.area) && (!q || (d.id + d.text + d.why).includes(q)));
  return `<section class="card enter"><h2>القرارات</h2>
    <div class="tools">
      <label class="muted" for="dq" style="position:absolute;width:1px;height:1px;overflow:hidden">بحث</label>
      <input type="search" id="dq" placeholder="ابحث في القرارات…" value="${esc(ui.q)}">
      <select id="da" aria-label="القسم"><option value="">كل الأقسام</option>${areas.map((a) => `<option ${a === ui.area ? "selected" : ""}>${a}</option>`).join("")}</select>
      <div class="seg" role="group" aria-label="العرض"><button id="d-all" aria-selected="${!ui.openOnly}">الكل</button><button id="d-open" aria-selected="${ui.openOnly}">مفتوح فقط</button></div>
    </div>
    <div class="tablebox"><table><thead><tr><th>#</th><th>التاريخ</th><th>القسم</th><th>القرار</th><th>السبب</th><th>الحالة</th></tr></thead>
    <tbody>${rows.map((d) => `<tr><td class="id">${d.id}</td><td class="tab" style="white-space:nowrap">${d.date}</td><td>${d.area}</td><td>${esc(d.text)}</td><td class="muted">${esc(d.why)}</td><td><span class="pill ${d.open ? "p-orange" : "p-green"}">${d.open ? "مفتوح" : "معتمد"}</span></td></tr>`).join("") || '<tr><td colspan="6" class="muted">لا نتائج.</td></tr>'}</tbody></table></div></section>`;
}
function viewRisks() {
  return `<div class="stack"><section class="card enter"><h2>المخاطر</h2><p class="muted">مرتبة بالأثر. الأحمر يهدد الهدف، والبرتقالي يضعفه.</p>
    <div class="tablebox"><table><thead><tr><th>#</th><th>البند</th><th>الأثر</th><th>الحل</th><th>صاحبه</th><th>الموعد</th></tr></thead>
    <tbody>${RISKS.map(([id, t, imp, fix, who, when]) => `<tr class="${imp === "high" ? "r-red" : "r-orange"}"><td class="id">${id}</td><td>${esc(t)}</td><td><span class="pill ${imp === "high" ? "p-red" : "p-orange"}">${imp === "high" ? "يهدد الهدف" : "يضعفه"}</span></td><td>${esc(fix)}</td><td>${who}</td><td class="muted">${when}</td></tr>`).join("")}</tbody></table></div></section>
    <section class="card enter"><h2>افتراضات لم تُثبت بعد</h2><ul class="rules">${ASSUMPTIONS.map((a) => `<li>${esc(a)}</li>`).join("")}</ul></section></div>`;
}
function viewOffice() {
  return `<div class="stack">
    <section class="card enter"><h2>كلمات المختصين</h2><p class="muted">ابدأ رسالتك بالكلمة، فيرد Claude بدور المختص من بريفه.</p>
      <div class="words" style="margin-top:12px">${WORDS.map(([w, r, d, f]) => `<div class="card hover word"><code>${w}</code><b>${r}</b><span class="muted">${d}</span><span class="muted">${f}</span></div>`).join("")}</div></section>
    <div class="grid2">
      <section class="card enter"><h2>جمل البداية</h2>${PHRASES.map(([p, d]) => `<div class="phrase"><code>${p}</code><span class="muted">${d}</span></div>`).join("")}</section>
      <section class="card enter"><h2>قواعد العمل</h2><ul class="rules">${RULES.map((r) => `<li>${esc(r)}</li>`).join("")}</ul></section>
    </div></div>`;
}

function render() {
  renderTabs();
  const cur = current();
  $("#view").innerHTML = { status: viewStatus, decisions: viewDecisions, risks: viewRisks, office: viewOffice }[cur]();
  document.querySelectorAll("[data-phase]").forEach((b) => (b.onclick = () => { ui.phase = ui.phase === b.dataset.phase ? null : b.dataset.phase; render(); }));
  const cp = $("#clear-phase"); if (cp) cp.onclick = () => { ui.phase = null; render(); };
  const dq = $("#dq"); if (dq) dq.oninput = () => { ui.q = dq.value; const pos = dq.selectionStart; render(); const n = $("#dq"); n.focus(); n.setSelectionRange(pos, pos); };
  const da = $("#da"); if (da) da.onchange = () => { ui.area = da.value; render(); };
  const dall = $("#d-all"); if (dall) dall.onclick = () => { ui.openOnly = false; render(); };
  const dop = $("#d-open"); if (dop) dop.onclick = () => { ui.openOnly = true; render(); };
}
window.addEventListener("hashchange", render);
render();
</script>
