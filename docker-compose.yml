# تشغيل كامل بأمر واحد:  docker compose up --build
# ثم افتح http://localhost:3000 وادخل بحساب تجريبي (انظر README).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: qaddimha
      POSTGRES_PASSWORD: qaddimha_dev
      POSTGRES_DB: qaddimha
    volumes:
      - qaddimha_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qaddimha -d qaddimha"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://qaddimha:qaddimha_dev@db:5432/qaddimha
      # بيئة تجريبية: حسابات العرض والدفع المحاكى مفعّلة. لا تستخدمها للإنتاج.
      APP_ENV: development
      SEED_DEMO: "1"
      PAYMENTS_MODE: simulated
      # اترك المفتاح فارغًا للوضع التجريبي، أو ضع مفتاحك ومعرف النموذج لتفعيل المزود الحقيقي
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    ports:
      - "3000:3000"
    volumes:
      - qaddimha_files:/data

volumes:
  qaddimha_pg:
  qaddimha_files:
